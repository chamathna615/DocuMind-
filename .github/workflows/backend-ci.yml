name: Backend CI
on:
  push:
    branches: [main]
    paths: ["DocuMind-Backend/**"]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: DocuMind-Backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: DocuMind-Backend/package-lock.json
      - run: npm ci
      - name: Syntax check all source files
        run: find . -name "*.js" -not -path "./node_modules/*" -not -path "./uploads/*" -print0 | xargs -0 -n1 node --check
      - run: npm audit --audit-level=high
        continue-on-error: true

          deploy:
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
