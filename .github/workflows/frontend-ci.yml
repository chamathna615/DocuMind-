name: Frontend CI
on:
  push:
    branches: [main]
    paths: ["DocuMind-Frontend/**"]
  pull_request:
    paths: ["DocuMind-Frontend/**"]

jobs:
  test-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: DocuMind-Frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: DocuMind-Frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_API_BASE_URL: https://example.com
          VITE_GOOGLE_CLIENT_ID: ci-placeholder

  e2e:
    runs-on: ubuntu-latest
    needs: test-build
    continue-on-error: true  # temporary: e2e tests need a mocked API (they log in against a real backend)
    defaults:
      run:
        working-directory: DocuMind-Frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: DocuMind-Frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=chromium
